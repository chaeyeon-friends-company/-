<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채연 프랜즈 컴퍼니 v2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 1. 전체 배경색: 여자 아이들이 좋아하는 예쁜 딸기우유 핑크 */
        body {
            background-color: #FFD1DC;
            font-family: 'Gaegu', cursive;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 2. 무지개색으로 움직이는 인사말 설정 (좌측 -> 우측) */
        .marquee-container {
            width: 100%;
            background-color: white;
            padding: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 32px;
            font-weight: bold;
            /* 무지개색 그라데이션 */
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 움직이는 마법 (좌측에서 우측으로) */
            animation: moveRight 10s linear infinite;
        }

        @keyframes moveRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 3. 제목 스타일 */
        header {
            text-align: center;
            padding: 40px;
        }

        header h1 {
            font-size: 60px;
            color: #D81B60;
            margin: 0;
            text-shadow: 2px 2px white;
        }

        /* 4. 카드 메뉴 스타일 (활성화 기능 포함) */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1000px;
        }

        .card {
            background-color: white;
            border-radius: 30px;
            width: 300px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            /* 마우스를 올리면 커지는 효과 */
            transition: transform 0.3s, box-shadow 0.3s;
            border: 4px solid #F8BBD0;
        }

        .card:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.4);
        }

        .card h2 {
            font-size: 30px;
            color: #C2185B;
        }

        .card p {
            font-size: 20px;
            color: #555;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        /* 하단 꾸미기 */
        footer {
            margin-top: 50px;
            padding: 20px;
            font-size: 18px;
            color: #888;
        }

        /* 클릭했을 때 나오는 팝업 스타일 */
        .hidden-msg {
            display: none;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            color: #E91E63;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="marquee-container">
        <div class="marquee-text">
            ✨ 안녕! 채연이의 홈페이지에 온 걸 환영해! ✨ 반가워 채연아! ✨ 우리 같이 재미있게 놀자! ✨
        </div>
    </div>

    <header>
        <h1>🏰 채연 프랜즈 컴퍼니 🏰</h1>
    </header>

    <div class="container">
        <div class="card" onclick="activateCard('slime')">
            <div class="icon">🧪</div>
            <h2>슬라임 연구소</h2>
            <p>말랑말랑 무지개 슬라임을<br>만들어보는 실험실이에요!</p>
            <div id="slime-msg" class="hidden-msg">말랑말랑~ 슬라임이 완성됐어요!</div>
        </div>

        <div class="card" onclick="activateCard('friends')">
            <div class="icon">👭</div>
            <h2>친구들과 함께</h2>
            <p>채연이와 친구들이 모여서<br>재미있게 노는 공간이에요!</p>
            <div id="friends-msg" class="hidden-msg">친구들아 모여라! 하트 뿅뿅! ❤️</div>
        </div>

        <div class="card" onclick="activateCard('toys')">
            <div class="icon">🎁</div>
            <h2>인기 상품 리스트</h2>
            <p>티니핑, 산리오 등 요즘<br>가장 갖고 싶은 보물들!</p>
            <div id="toys-msg" class="hidden-msg">캐치! 티니핑과 쿠로미가 기다려요!</div>
        </div>
    </div>

    <footer>
        채연이의 홈페이지 | 제작: 할아버지 ❤️
    </footer>

    <script>
        function activateCard(type) {
            // 모든 메시지 숨기기
            document.querySelectorAll('.hidden-msg').forEach(el => el.style.display = 'none');
            
            // 클릭한 카드에 맞는 메시지 보여주기 + 알림창 띄우기
            if(type === 'slime') {
                document.getElementById('slime-msg').style.display = 'block';
                alert("🧪 슬라임 연구실 활성화! 말랑말랑 소리가 들려요!");
            } else if(type === 'friends') {
                document.getElementById('friends-msg').style.display = 'block';
                alert("👭 친구들 소환 완료! 하트 폭죽이 팡팡!");
            } else if(type === 'toys') {
                document.getElementById('toys-msg').style.display = 'block';
                alert("🎁 위시리스트 오픈! 티니핑 친구들이 나타났어요!");
            }
        }
    </script>
</body>
</html>
